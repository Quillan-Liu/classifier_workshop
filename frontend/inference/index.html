<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>推理对话 · TMF</title><link rel="stylesheet" href="/ui/shared.css?v=20261120-nav13"><link rel="stylesheet" href="/ui/inference/style.css?v=20261120-4"><script src="/ui/inference/app.js?v=20261120-4" defer></script></head>
<body><div class="ambient-wallpaper" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div><header class="workspace-toolbar"><nav class="workspace-tabs" aria-label="工作台导航"><a href="/inference" aria-current="page">模型推理</a><a href="/training">训练工作室</a><a href="/model-management">模型管理</a></nav><div class="toolbar-actions"><button id="reset-page" type="button" class="toolbar-icon" aria-label="刷新推理页面" title="刷新推理页面"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M6.1 7a7 7 0 0 1 11.6-1L20 9M4 15l2.3 3A7 7 0 0 0 17.9 17"/></svg></button></div></header>
<main class="chat-shell"><div class="conversation">
<div class="composer-area"><a class="brand composer-brand" href="/model-management" aria-label="TMF 模型工作台"><span class="logo">T</span><span>TMF</span></a><h1 class="composer-greeting">让文字，找到它的归属。</h1><form id="form" class="composer"><label for="text" class="sr-only">待分类文本</label><textarea id="text" rows="2" maxlength="20000" required placeholder="输入需要分类的文本…"></textarea>
<div class="composer-actions"><span class="input-hint">Enter 发送 · Shift + Enter 换行</span><div class="send-controls"><div id="model-picker" class="model-picker"><button id="model-toggle" type="button" aria-expanded="false" aria-controls="model-menu" disabled><span id="selected-model">选择模型</span><span aria-hidden="true">⌄</span></button><div id="model-menu" class="model-menu" hidden><div class="menu-heading"><strong>选择推理模型</strong><button id="refresh" type="button">刷新</button></div><p id="menu-state" role="status">正在加载模型…</p><div id="model-options"></div></div></div><button id="submit" type="submit" aria-label="发送并开始推理" title="发送" disabled>↑</button></div></div></form><p id="state" class="composer-note" role="status">正在加载模型…</p></div>
<div id="messages" class="messages" role="log" aria-label="推理结果" aria-live="polite"></div></div><section id="probability-panel" class="probability-panel" aria-label="标签概率分布" aria-hidden="true"><div id="probability-chart" class="probability-chart"></div></section></main></body></html>
