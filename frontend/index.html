<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>新闻标题分类</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <main class="card">
    <h1>新闻标题分类</h1>
    <p class="intro">输入一条新闻标题，选择模型查看预测类别。</p>
    <form id="classify-form">
      <label for="model">推理模型</label>
      <select id="model" name="model">
        <option value="rf">随机森林（RF）</option>
        <option value="ft">fastText</option>
        <option value="bert">BERT</option>
        <option value="bert-trainer">bert-trainer训练</option>
        <option value="llm">LLM</option>
      </select>
      <label for="title">新闻标题</label>
      <input id="title" name="title" type="text" placeholder="请输入一条新闻标题" required autofocus>
      <button id="submit" type="submit">开始分类</button>
    </form>
    <div id="result" role="status" aria-live="polite" hidden></div>
  </main>
</body>
</html>
