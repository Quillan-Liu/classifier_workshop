<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>模型管理 · TMF</title><link rel="stylesheet" href="/ui/shared.css?v=20261120-nav13"><link rel="stylesheet" href="/ui/model_management/style.css?v=20261120-5"><script src="/ui/model_management/app.js?v=20261120-7" defer></script>
<style>main{max-width:1450px}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;padding:17px 12px;border-bottom:1px solid #e5ebef}th{color:#647589;white-space:nowrap}.row-number{width:56px;text-align:center;font-variant-numeric:tabular-nums}.model-name{min-width:200px;overflow-wrap:anywhere}td:last-child{white-space:nowrap}.actions{display:flex;gap:8px}.actions button{min-height:34px;padding:6px 10px;font-size:14px}.danger{color:#af3333;background:#fff1f1}.danger:hover{background:#ffe0e0}.pagination{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:24px}.pagination div{display:flex;gap:12px;align-items:center}dialog{border:1px solid #d8e2e9;border-radius:14px;padding:28px;width:min(760px,94vw);max-height:85vh;overflow:auto;color:#182b42}dialog::backdrop{background:#182b4266}dialog h2{margin-bottom:20px}dialog form{display:grid;gap:18px}.dialog-actions{display:flex;justify-content:flex-end;gap:10px}#detail-meta{display:grid;grid-template-columns:100px 1fr;gap:16px}#detail-meta dd{text-align:left}.link{color:#276c58;background:transparent;padding:0;text-align:left;overflow-wrap:anywhere;white-space:normal}.link:hover{background:transparent;text-decoration:underline}#edit-error{color:#b13232;font-size:14px}nav{display:flex;gap:24px}
</style></head><body class="registry-page">
<header class="workspace-toolbar"><nav class="workspace-tabs" aria-label="工作台导航"><a href="/inference">模型推理</a><a href="/training">训练工作室</a><a href="/model-management" aria-current="page">模型管理</a></nav></header>
<main><div class="heading"><div><p class="eyebrow">MODEL REGISTRY</p><h1>模型管理</h1><p class="muted">管理训练产物、评估结果与模型参数</p></div></div>
<section><div class="section-head"><h2 id="count">模型列表</h2><div class="registry-tools"><button id="bulk-cancel" type="button" class="secondary" hidden>取消</button><button id="bulk-delete" type="button" class="danger" disabled>批量删除</button><button id="refresh" type="button" class="secondary registry-refresh" aria-label="刷新模型列表" title="刷新模型列表"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M6.1 7a7 7 0 0 1 11.6-1L20 9M4 15l2.3 3A7 7 0 0 0 17.9 17"/></svg></button></div></div><div class="table-wrap"><table><thead><tr><th class="selection-cell" hidden><input id="select-all" type="checkbox" aria-label="全选全部模型（包含所有页面）" title="全选全部模型（包含所有页面）"></th><th scope="col" class="row-number">序号</th><th>模型名称</th><th>类型 / 用途</th><th>准确率</th><th>精确率</th><th>召回率</th><th>F1</th><th>登记时间</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div><p id="state" role="status" aria-live="polite">正在加载…</p><div class="pagination"><div><button id="previous" class="secondary" type="button">上一页</button><span id="page-info">第 1 / 1 页</span><button id="next" class="secondary" type="button">下一页</button></div></div></section>
<dialog id="detail"><h2>模型详情</h2><dl id="detail-meta"></dl><h3>训练超参数</h3><pre id="detail-params"></pre><h3>训练 / 验证 / 测试指标</h3><div id="detail-metrics"></div><h3>完整评估结果</h3><pre id="detail-result"></pre><div class="dialog-actions"><button type="button" data-close="detail">关闭</button></div></dialog>
<dialog id="edit"><form id="edit-form"><h2>修改模型名称</h2><label>模型名称<input id="new-name" maxlength="200" required></label><p class="hint">修改名称会同步重命名模型文件夹并更新数据库路径。</p><p id="edit-error" role="alert"></p><div class="dialog-actions"><button type="button" class="secondary" data-close="edit">取消</button><button id="save-name" type="submit">保存名称</button></div></form></dialog>
<dialog id="delete"><h2>删除模型</h2><p id="delete-description"></p><p class="hint">删除后模型将从管理列表移除，模型文件保留，文件夹名称添加 _del_ 前缀。</p><div class="dialog-actions"><button type="button" class="secondary" data-close="delete">取消</button><button id="confirm-delete" type="button" class="danger">确认删除</button></div><p id="delete-error" role="alert" class="error"></p></dialog>
</main></body></html>
